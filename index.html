<!DOCTYPE html>
<html lang="en">
<!--
  Single-file markdown wiki: renders navigation.md (sidebar) and *.md pages client-side.
  URLs: #!path/page.md[#heading]
  Bundles marked 18.1.2 (MIT) and highlight.js 11.12.0 (BSD-3-Clause).
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 8h9a5 5 0 0 1 5 5v11H14a5 5 0 0 1-5-5z' fill='%23fff'/%3E%3C/svg%3E">
<script>
document.documentElement.dataset.theme = localStorage.getItem('wiki-theme')
  || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --header-h: 60px;
  --sidebar-w: 272px;
  --toc-w: 232px;
  --content-w: 800px;

  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --bg-mute: #eceef2;
  --border: #e2e5e9;
  --text: #1d2127;
  --text-2: #545d68;
  --text-3: #8a929c;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, .09);
  --code-bg: #f6f8fa;
  --code-inline: rgba(130, 140, 155, .16);
  --mark: rgba(250, 204, 21, .45);
  --shadow: 0 12px 40px rgba(15, 23, 42, .18);

  --hl-comment: #6e7781;
  --hl-keyword: #cf222e;
  --hl-string: #0a3069;
  --hl-number: #0550ae;
  --hl-title: #8250df;
  --hl-variable: #953800;
  --hl-tag: #116329;
  --hl-add-bg: #dafbe1;
  --hl-del-bg: #ffebe9;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #15171c;
  --bg-soft: #1b1e24;
  --bg-mute: #252932;
  --border: #2b3039;
  --text: #e4e7eb;
  --text-2: #a3abb6;
  --text-3: #6c7480;
  --accent: #6aa6ff;
  --accent-soft: rgba(106, 166, 255, .12);
  --code-bg: #1d2027;
  --code-inline: rgba(140, 150, 170, .18);
  --mark: rgba(250, 204, 21, .3);
  --shadow: 0 12px 40px rgba(0, 0, 0, .5);

  --hl-comment: #768390;
  --hl-keyword: #f47067;
  --hl-string: #96d0ff;
  --hl-number: #6cb6ff;
  --hl-title: #dcbdfb;
  --hl-variable: #f69d50;
  --hl-tag: #8ddb8c;
  --hl-add-bg: rgba(70, 149, 74, .2);
  --hl-del-bg: rgba(229, 83, 75, .2);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.7 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button { font: inherit; color: inherit; }
::selection { background: var(--accent-soft); }

/* ---------- header ---------- */

.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 30;
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { font-weight: 650; font-size: 17px; color: var(--text); white-space: nowrap; letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.spacer { flex: 1; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border: 0; border-radius: 8px;
  background: transparent; color: var(--text-2); cursor: pointer;
}
.icon-btn:hover { background: var(--bg-mute); color: var(--text); }
#menu-toggle { display: none; margin-left: -8px; }
.search-btn {
  display: flex; align-items: center; gap: 8px;
  width: 240px; height: 36px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-soft); color: var(--text-3); cursor: pointer; font-size: 14px;
}
.search-btn:hover { border-color: var(--accent); }
.search-btn span { flex: 1; text-align: left; }
kbd {
  font: 12px var(--font); padding: 1px 6px; border-radius: 5px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text-3);
}
[data-theme="dark"] .icon-sun, :root:not([data-theme="dark"]) .icon-moon { display: none; }

/* ---------- layout ---------- */

.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--toc-w);
  padding-top: var(--header-h);
  max-width: 1600px; margin: 0 auto;
}
.no-toc .layout { grid-template-columns: var(--sidebar-w) minmax(0, 1fr) 0; }

.sidebar {
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow-y: auto; overscroll-behavior: contain;
  padding: 24px 16px 48px 20px;
  border-right: 1px solid var(--border);
  font-size: 14.5px;
  scrollbar-width: thin;
}
.nav-link {
  display: block; padding: 5px 10px; margin: 1px 0;
  border-radius: 6px; color: var(--text-2); line-height: 1.45;
}
.nav-link:hover { color: var(--text); background: var(--bg-soft); text-decoration: none; }
.nav-link.active { color: var(--accent); background: var(--accent-soft); font-weight: 550; }
#nav > .nav-link { font-weight: 600; color: var(--text); }
#nav > .nav-link.active { color: var(--accent); }
.nav-group { margin: 14px 0 4px; }
.nav-group-title {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 5px 10px; border: 0; background: none; cursor: pointer;
  font-weight: 650; color: var(--text); text-align: left; border-radius: 6px;
}
.nav-group-title:hover { background: var(--bg-soft); }
.nav-group-title svg { width: 15px; height: 15px; color: var(--text-3); transform: rotate(90deg); transition: transform .15s; }
.nav-group.collapsed .nav-group-title svg { transform: none; }
.nav-group.collapsed .nav-items { display: none; }
.nav-items { margin-left: 10px; padding-left: 8px; border-left: 1px solid var(--border); }

main { min-width: 0; padding: 40px 48px 64px; }
#content { max-width: var(--content-w); margin: 0 auto; transition: opacity .15s; }
#content.loading { opacity: .4; }

.toc {
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow-y: auto; padding: 40px 20px 40px 8px;
  font-size: 13.5px; scrollbar-width: thin;
}
.no-toc .toc { display: none; }
.toc-title { font-weight: 650; color: var(--text); margin-bottom: 8px; }
.toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--border); }
.toc a {
  display: block; padding: 3px 0 3px 12px; margin-left: -1px;
  border-left: 2px solid transparent; color: var(--text-2); line-height: 1.45;
}
.toc .toc-h3 a { padding-left: 24px; }
.toc a:hover { color: var(--text); text-decoration: none; }
.toc a.active { color: var(--accent); border-left-color: var(--accent); }

/* ---------- document ---------- */

.eyebrow { color: var(--accent); font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { position: relative; line-height: 1.3; letter-spacing: -.015em; font-weight: 650; }
.doc h1 { font-size: 2.1rem; margin: 0 0 1.2rem; font-weight: 700; letter-spacing: -.02em; }
.doc h2 { font-size: 1.5rem; margin: 2.6rem 0 1rem; padding-top: 1.4rem; border-top: 1px solid var(--border); }
.doc h1 + h2, .doc > h2:first-child { border-top: 0; padding-top: 0; margin-top: 1.5rem; }
.doc h3 { font-size: 1.2rem; margin: 2rem 0 .7rem; }
.doc h4 { font-size: 1.05rem; margin: 1.6rem 0 .5rem; }
.doc .anchor {
  position: absolute; left: -.9em; padding-right: .2em;
  color: var(--accent); opacity: 0; font-weight: 500; transition: opacity .1s;
}
.doc :hover > .anchor, .doc .anchor:focus { opacity: 1; text-decoration: none; }
.doc p, .doc ul, .doc ol, .doc blockquote, .doc .table-wrap, .doc .code-block { margin: 0 0 1.1rem; }
.doc ul, .doc ol { padding-left: 1.5em; }
.doc li { margin: .25rem 0; }
.doc li > ul, .doc li > ol { margin: .25rem 0; }
.doc li > p { margin: .4rem 0; }
.doc li > .code-block { margin: .6rem 0 .9rem; }
.doc li::marker { color: var(--text-3); }
.doc a.external::after {
  content: "↗"; display: inline-block; margin-left: .15em;
  font-size: .75em; color: var(--text-3); vertical-align: super; line-height: 0;
}
.doc hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
.doc blockquote {
  padding: .6rem 1rem; border-left: 3px solid var(--accent);
  background: var(--bg-soft); border-radius: 0 8px 8px 0; color: var(--text-2);
}
.doc blockquote > :last-child { margin-bottom: 0; }
.doc img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border); vertical-align: middle; }
.doc img.zoomable { cursor: zoom-in; }
.doc :not(pre) > code {
  font: .875em var(--mono); padding: .15em .4em;
  background: var(--code-inline); border-radius: 5px; overflow-wrap: anywhere;
}
.doc mark { background: var(--mark); color: inherit; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.doc th, .doc td { padding: 8px 14px; border-bottom: 1px solid var(--border); text-align: left; }
.doc th { background: var(--bg-soft); font-weight: 600; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
.doc tbody tr:hover { background: var(--bg-soft); }

/* ---------- code ---------- */

.code-block { position: relative; }
.code-block pre {
  margin: 0; padding: 14px 18px; overflow-x: auto;
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
  font: 13.5px/1.6 var(--mono); tab-size: 4; scrollbar-width: thin;
}
.code-block code { font: inherit; background: none; padding: 0; }
.code-block .lang {
  position: absolute; top: 6px; right: 12px; z-index: 1;
  font: 11.5px var(--mono); color: var(--text-3); transition: opacity .15s; pointer-events: none;
}
.code-block .copy {
  position: absolute; top: 7px; right: 7px; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg); color: var(--text-2);
  opacity: 0; transition: opacity .15s;
}
.code-block .copy svg { width: 16px; height: 16px; }
.code-block .copy:hover { color: var(--text); border-color: var(--text-3); }
.code-block .copy.done { color: #16a34a; opacity: 1; }
.code-block:hover .copy, .code-block .copy:focus-visible { opacity: 1; }
.code-block:hover .lang { opacity: 0; }
@media (hover: none) { .code-block .copy { opacity: .8; } .code-block .lang { display: none; } }

.hljs { color: var(--text); }
.hljs-comment, .hljs-quote, .hljs-meta .hljs-comment { color: var(--hl-comment); font-style: italic; }
.hljs-keyword, .hljs-selector-tag, .hljs-type, .hljs-template-tag, .hljs-doctag { color: var(--hl-keyword); }
.hljs-string, .hljs-regexp, .hljs-meta .hljs-string, .hljs-char.escape_ { color: var(--hl-string); }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet, .hljs-meta, .hljs-selector-id, .hljs-selector-class, .hljs-link { color: var(--hl-number); }
.hljs-title, .hljs-title.function_, .hljs-title.class_, .hljs-section { color: var(--hl-title); }
.hljs-section { font-weight: 600; }
.hljs-variable, .hljs-template-variable, .hljs-attr, .hljs-attribute, .hljs-built_in, .hljs-params, .hljs-property, .hljs-selector-attr, .hljs-selector-pseudo { color: var(--hl-variable); }
.hljs-name, .hljs-tag, .hljs-subst { color: var(--hl-tag); }
.hljs-subst { color: var(--text); }
.hljs-addition { color: var(--hl-tag); background: var(--hl-add-bg); }
.hljs-deletion { color: var(--hl-keyword); background: var(--hl-del-bg); }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: 700; }

/* ---------- footer ---------- */

.doc-footer { margin-top: 3.5rem; }
.modified { font-size: 13.5px; color: var(--text-3); margin-bottom: 1.2rem; text-align: right; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; border-top: 1px solid var(--border); padding-top: 24px; }
.pager-link {
  display: flex; flex-direction: column; gap: 2px;
  padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px;
}
.pager-link:hover { border-color: var(--accent); text-decoration: none; }
.pager-link.next { text-align: right; grid-column: 2; }
.pager-label { font-size: 12.5px; color: var(--text-3); }
.pager-title { font-weight: 600; }
.pager-link.prev .pager-title::before { content: "← "; }
.pager-link.next .pager-title::after { content: " →"; }

/* ---------- search ---------- */

dialog { color: var(--text); }
dialog::backdrop { background: rgba(10, 14, 22, .45); backdrop-filter: blur(2px); }
#search {
  width: min(640px, calc(100vw - 24px)); max-height: min(560px, calc(100vh - 120px));
  margin: 80px auto auto; padding: 0;
  border: 1px solid var(--border); border-radius: 14px;
  background: var(--bg); box-shadow: var(--shadow);
  overflow: hidden;
}
#search[open] { display: flex; flex-direction: column; }
.search-field { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); color: var(--text-3); }
#search-input {
  flex: 1; height: 56px; border: 0; outline: 0; background: transparent;
  font: 17px var(--font); color: var(--text);
}
#search-results { list-style: none; margin: 0; padding: 8px; overflow-y: auto; }
#search-results:empty { display: none; }
#search-results a {
  display: block; padding: 10px 12px; border-radius: 8px; color: var(--text);
}
#search-results a:hover { text-decoration: none; background: var(--bg-soft); }
#search-results a.selected { background: var(--accent-soft); }
.result-title { display: block; font-weight: 600; font-size: 15px; }
.result-heading { font-weight: 500; color: var(--text-2); }
.result-text { display: block; font-size: 13.5px; color: var(--text-2); line-height: 1.5; margin-top: 2px; overflow-wrap: anywhere; }
.result-text:empty { display: none; }
.search-empty { padding: 24px; text-align: center; color: var(--text-3); }

#lightbox {
  max-width: 96vw; max-height: 96vh; padding: 0; border: 0;
  background: transparent; cursor: zoom-out;
}
#lightbox img { display: block; max-width: 96vw; max-height: 96vh; border-radius: 8px; }

/* ---------- responsive ---------- */

#backdrop { display: none; }

@media (max-width: 1240px) {
  .layout, .no-toc .layout { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 900px) {
  #menu-toggle { display: inline-flex; }
  .layout, .no-toc .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; top: var(--header-h); left: 0; bottom: 0; z-index: 25;
    width: min(300px, 85vw); height: auto;
    background: var(--bg); transform: translateX(-100%); transition: transform .2s ease;
  }
  .nav-open .sidebar { transform: none; box-shadow: var(--shadow); }
  .nav-open #backdrop { display: block; position: fixed; inset: var(--header-h) 0 0 0; z-index: 20; background: rgba(10, 14, 22, .35); }
  main { padding: 28px 20px 48px; }
  .search-btn { width: auto; }
  .search-btn span, .search-btn kbd { display: none; }
  .doc h1 { font-size: 1.75rem; }
  .doc .anchor { display: none; }
}

@media print {
  .topbar, .sidebar, .toc, .pager, .code-block .copy { display: none !important; }
  .layout { display: block; padding: 0; }
  main { padding: 0; }
}
</style>
</head>
<body>
<header class="topbar">
  <button id="menu-toggle" class="icon-btn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a id="brand" class="brand" href="#!index.md"></a>
  <div class="spacer"></div>
  <button id="search-open" class="search-btn" type="button" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Search</span><kbd id="search-kbd"></kbd>
  </button>
  <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<div class="layout">
  <aside class="sidebar"><nav id="nav"></nav></aside>
  <main><div id="content"></div></main>
  <aside class="toc"><nav id="toc"></nav></aside>
</div>
<div id="backdrop"></div>
<dialog id="search" aria-label="Search">
  <div class="search-field">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search-input" type="text" placeholder="Search the wiki…" autocomplete="off" spellcheck="false">
    <kbd>Esc</kbd>
  </div>
  <ul id="search-results"></ul>
</dialog>
<dialog id="lightbox"><img alt=""></dialog>
<script>

<script>
(() => {
'use strict';

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const h = (tag, attrs = {}, ...children) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  el.append(...children);
  return el;
};
const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const INDEX = 'index.md';

const state = {
  siteTitle: document.title,
  nav: [],        // [{title, page|href}] or [{title, items: [...]}]
  flat: [],       // nav entries pointing to local .md pages, in order
  page: null,
  cache: new Map(), // page -> Promise<{text, modified}>
};

// ---------- paths & routing ----------

const isExternal = href => /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href);
const dirname = p => p.slice(0, p.lastIndexOf('/') + 1);
const safeDecode = s => { try { return decodeURIComponent(s); } catch { return s; } };

function normalize(path) {
  const out = [];
  for (const part of path.split('/')) {
    if (part === '..') out.pop();
    else if (part && part !== '.') out.push(part);
  }
  return out.join('/');
}

// Resolves a link found in `page` -> {page, anchor} for wiki pages, {url} for anything else.
function resolveLink(href, page) {
  if (href.startsWith('#!')) return parseRoute(href.slice(2));
  if (href.startsWith('#')) return { page, anchor: safeDecode(href.slice(1)) };
  if (isExternal(href)) return { url: href, external: true };
  const i = href.indexOf('#');
  const path = safeDecode(i < 0 ? href : href.slice(0, i));
  const anchor = i < 0 ? '' : safeDecode(href.slice(i + 1));
  if (/\.md$/i.test(path)) return { page: path.startsWith('/') ? normalize(path) : normalize(dirname(page) + path), anchor };
  if (path.startsWith('/')) return { url: href };
  return { url: encodeURI(normalize(dirname(page) + path)) + (i < 0 ? '' : href.slice(i)) };
}

function parseRoute(route) {
  route = safeDecode(route);
  const i = route.indexOf('#');
  return { page: (i < 0 ? route : route.slice(0, i)) || INDEX, anchor: i < 0 ? '' : route.slice(i + 1) };
}

function currentRoute() {
  const hash = location.hash;
  if (hash.startsWith('#!')) return parseRoute(hash.slice(2));
  if (hash.length > 1 && !/\.md(#|$)/i.test(hash)) return { page: state.page || INDEX, anchor: safeDecode(hash.slice(1)) };
  return parseRoute(hash.slice(1));
}

const routeHref = (page, anchor) => '#!' + encodeURI(page) + (anchor ? '#' + encodeURIComponent(anchor) : '');

// Only same-origin markdown files may be loaded (the route comes from the URL).
function isAllowedPage(page) {
  if (!/\.md$/i.test(page) || isExternal(page)) return false;
  try { return new URL(page, location.href).origin === location.origin; } catch { return false; }
}

function fetchPage(page) {
  if (!state.cache.has(page)) {
    const p = fetch(encodeURI(page), { cache: 'no-cache' }).then(async res => {
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return { text: await res.text(), modified: res.headers.get('Last-Modified') };
    });
    p.catch(() => state.cache.delete(page));
    state.cache.set(page, p);
  }
  return state.cache.get(page);
}

// ---------- markdown ----------

function slugify(text) {
  return text.toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '') || 'section';
}

// Code blocks without a language are almost always shell commands in this wiki;
// label other languages explicitly (```sql, ```ini, ```text, ...).
function highlight(text, lang) {
  const language = hljs.getLanguage(lang || 'bash') ? lang || 'bash' : 'plaintext';
  const html = hljs.highlight(text, { language, ignoreIllegals: true }).value;
  return { html, lang: ['text', 'txt', 'plaintext'].includes(lang) ? '' : lang };
}

const ICON_COPY = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

// Renders markdown of `page` into a detached <article>. With `full`, also adds the
// interactive bits (highlighting, copy buttons, ...) that the search index doesn't need.
function renderPage(md, page, full = true) {
  const doc = h('article', { class: 'doc' });
  doc.innerHTML = marked.parse(md, { gfm: true });

  const seen = new Map();
  for (const hd of $$('h1, h2, h3, h4, h5, h6', doc)) {
    let id = slugify(hd.textContent);
    const n = seen.get(id) || 0;
    seen.set(id, n + 1);
    if (n) id += '-' + n;
    hd.id = id;
  }
  if (!full) return doc;

  for (const a of $$('a[href]', doc)) {
    const target = resolveLink(a.getAttribute('href'), page);
    if (target.url) {
      a.setAttribute('href', target.url);
      if (target.external) { a.target = '_blank'; a.rel = 'noopener'; a.classList.add('external'); }
    } else {
      a.setAttribute('href', routeHref(target.page, target.anchor));
    }
  }
  for (const img of $$('img[src]', doc)) {
    const src = img.getAttribute('src');
    if (!isExternal(src) && !src.startsWith('/')) img.setAttribute('src', resolveLink(src, page).url);
    img.loading = 'lazy';
    if (!img.closest('a')) img.classList.add('zoomable');
  }
  for (const hd of $$('h2, h3, h4', doc)) {
    hd.append(h('a', { class: 'anchor', href: routeHref(page, hd.id), 'aria-label': 'Link to this section' }, '#'));
  }
  for (const table of $$('table', doc)) table.replaceWith(h('div', { class: 'table-wrap' }, table.cloneNode(true)));
  for (const code of $$('pre > code', doc)) {
    const pre = code.parentElement;
    const lang = ([...code.classList].find(c => c.startsWith('language-')) || '').slice(9).toLowerCase();
    const text = code.textContent.replace(/\n$/, '');
    const res = highlight(text, lang);
    code.className = 'hljs';
    code.innerHTML = res.html;
    const copy = h('button', { class: 'copy', type: 'button', title: 'Copy', 'aria-label': 'Copy code' });
    copy.innerHTML = ICON_COPY;
    copy.addEventListener('click', () => copyText(text, copy));
    const block = h('div', { class: 'code-block' });
    pre.replaceWith(block);
    if (res.lang) block.append(h('span', { class: 'lang' }, res.lang));
    block.append(copy, pre);
  }
  return doc;
}

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = h('textarea', { style: 'position:fixed;opacity:0' });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  button.innerHTML = ICON_CHECK;
  button.classList.add('done');
  setTimeout(() => { button.innerHTML = ICON_COPY; button.classList.remove('done'); }, 1500);
}

// ---------- navigation ----------

function firstLink(tokens) {
  for (const t of tokens || []) {
    if (t.type === 'link') return t;
    if (t.type === 'list') continue;
    const l = firstLink(t.tokens);
    if (l) return l;
  }
  return null;
}

function navEntry(link) {
  const href = link.href || '';
  const entry = { title: link.text.replace(/[*_`]/g, '') };
  const target = href && resolveLink(href, INDEX);
  if (target && target.page) entry.page = target.page;
  else if (target) { entry.href = target.url; entry.external = !!target.external; }
  return entry;
}

function parseNav(md) {
  const nav = [];
  let group = null;
  for (const t of marked.lexer(md)) {
    if (t.type === 'heading' && t.depth === 1) state.siteTitle = t.text;
    else if (t.type === 'heading') nav.push(group = { title: t.text, items: [] });
    else if (t.type === 'paragraph') {
      for (const l of t.tokens.filter(x => x.type === 'link')) {
        const entry = navEntry(l);
        if (!l.href || l.href === '#') nav.push(group = { title: entry.title, items: [] });
        else { nav.push(entry); group = null; }
      }
    } else if (t.type === 'list') {
      for (const item of t.items) {
        const l = firstLink(item.tokens);
        if (l) (group ? group.items : nav).push(navEntry(l));
      }
    }
  }
  return nav;
}

const CHEVRON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

function navLink(entry) {
  if (entry.page) return h('a', { class: 'nav-link', href: routeHref(entry.page), 'data-page': entry.page }, entry.title);
  const a = h('a', { class: 'nav-link', href: entry.href || '#' }, entry.title);
  if (entry.external) { a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}

function renderNav() {
  const collapsed = new Set(JSON.parse(localStorage.getItem('wiki-collapsed') || '[]'));
  const root = $('#nav');
  root.textContent = '';
  for (const entry of state.nav) {
    if (!entry.items) { root.append(navLink(entry)); continue; }
    const group = h('section', { class: 'nav-group' + (collapsed.has(entry.title) ? ' collapsed' : '') });
    const btn = h('button', { class: 'nav-group-title', type: 'button' }, entry.title);
    btn.insertAdjacentHTML('beforeend', CHEVRON);
    btn.addEventListener('click', () => {
      group.classList.toggle('collapsed');
      const now = new Set(JSON.parse(localStorage.getItem('wiki-collapsed') || '[]'));
      group.classList.contains('collapsed') ? now.add(entry.title) : now.delete(entry.title);
      localStorage.setItem('wiki-collapsed', JSON.stringify([...now]));
    });
    group.append(btn, h('div', { class: 'nav-items' }, ...entry.items.map(navLink)));
    root.append(group);
  }
  $('#brand').textContent = state.siteTitle;
}

function markActiveNav(page) {
  for (const a of $$('#nav .active')) a.classList.remove('active');
  const a = $$('#nav a[data-page]').find(x => x.dataset.page === page);
  if (!a) return;
  a.classList.add('active');
  a.closest('.nav-group')?.classList.remove('collapsed');
  a.scrollIntoView({ block: 'nearest' });
}

function navInfo(page) {
  const i = state.flat.findIndex(e => e.page === page);
  const group = state.nav.find(e => e.items && e.items.some(x => x.page === page));
  return { entry: state.flat[i], prev: i > 0 ? state.flat[i - 1] : null, next: i >= 0 ? state.flat[i + 1] : null, group };
}

function pageTitle(page, doc) {
  const h1 = doc && $('h1', doc);
  if (h1) return h1.textContent;
  const entry = state.flat.find(e => e.page === page);
  if (entry) return entry.title;
  const name = page.split('/').pop().replace(/\.md$/i, '').replace(/[-_]+/g, ' ');
  return name.charAt(0).toUpperCase() + name.slice(1);
}

// ---------- page ----------

let scrollSpy = null;

async function show(route) {
  const { page, anchor } = route;
  if (page === state.page) { scrollToAnchor(anchor); return; }
  state.page = page;
  document.body.classList.remove('nav-open');
  markActiveNav(page);
  const main = $('#content');
  main.classList.add('loading');

  let doc, modified = null;
  try {
    if (!isAllowedPage(page)) throw new Error('Not a wiki page');
    const res = await fetchPage(page);
    if (state.page !== page) return;
    modified = res.modified;
    doc = renderPage(res.text, page);
  } catch (err) {
    if (state.page !== page) return;
    doc = h('article', { class: 'doc' },
      h('h1', {}, 'Page not found'),
      h('p', {}, 'Could not load ', h('code', {}, page), ` (${err.message}).`),
      h('p', {}, h('a', { href: routeHref(INDEX) }, 'Back to the start page')));
  }

  const info = navInfo(page);
  const title = pageTitle(page, doc);
  if (!$('h1', doc)) doc.prepend(h('h1', {}, title));
  if (info.group) doc.prepend(h('div', { class: 'eyebrow' }, info.group.title));
  document.title = page === INDEX ? state.siteTitle : `${title} · ${state.siteTitle}`;

  const footer = h('footer', { class: 'doc-footer' });
  if (modified) footer.append(h('div', { class: 'modified' }, 'Last updated ' + new Date(modified).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })));
  if (info.prev || info.next) {
    const pager = h('nav', { class: 'pager' });
    const card = (e, label, cls) => h('a', { class: 'pager-link ' + cls, href: routeHref(e.page) }, h('span', { class: 'pager-label' }, label), h('span', { class: 'pager-title' }, e.title));
    pager.append(info.prev ? card(info.prev, 'Previous', 'prev') : h('span'));
    if (info.next) pager.append(card(info.next, 'Next', 'next'));
    footer.append(pager);
  }

  main.replaceChildren(doc, footer);
  main.classList.remove('loading');
  buildToc(doc);
  scrollToAnchor(anchor);
}

function scrollToAnchor(anchor) {
  const el = anchor && document.getElementById(anchor);
  if (el) el.scrollIntoView();
  else window.scrollTo(0, 0);
  updateToc();
}

function buildToc(doc) {
  const heads = $$('h2, h3', doc);
  const toc = $('#toc');
  toc.textContent = '';
  document.body.classList.toggle('no-toc', heads.length < 2);
  if (heads.length < 2) { scrollSpy = null; return; }
  toc.append(h('div', { class: 'toc-title' }, 'On this page'));
  const list = h('ul');
  for (const hd of heads) {
    const text = [...hd.childNodes].filter(n => !(n.classList && n.classList.contains('anchor'))).map(n => n.textContent).join('');
    list.append(h('li', { class: 'toc-' + hd.tagName.toLowerCase() }, h('a', { href: routeHref(state.page, hd.id), 'data-id': hd.id }, text)));
  }
  toc.append(list);
  scrollSpy = heads;
}

function updateToc() {
  if (!scrollSpy) return;
  const offset = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) + 24;
  let current = scrollSpy[0];
  for (const hd of scrollSpy) if (hd.getBoundingClientRect().top <= offset) current = hd;
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) current = scrollSpy[scrollSpy.length - 1];
  for (const a of $$('#toc a')) a.classList.toggle('active', a.dataset.id === current.id);
}

let tocFrame = 0;
window.addEventListener('scroll', () => {
  if (!tocFrame) tocFrame = requestAnimationFrame(() => { tocFrame = 0; updateToc(); });
}, { passive: true });

// ---------- search ----------

let searchIndex = null;

function buildSearchIndex() {
  if (searchIndex) return searchIndex;
  const pages = [...new Set([INDEX, ...state.flat.map(e => e.page)])];
  searchIndex = Promise.all(pages.map(async page => {
    try {
      const doc = renderPage((await fetchPage(page)).text, page, false);
      const title = pageTitle(page, doc);
      const sections = [{ page, title, heading: '', anchor: '', text: '' }];
      for (const el of doc.children) {
        if (/^H[1-6]$/.test(el.tagName)) {
          if (el.tagName === 'H1' && sections.length === 1 && !sections[0].text) continue;
          sections.push({ page, title, heading: el.textContent, anchor: el.id, text: '' });
        } else {
          sections[sections.length - 1].text += ' ' + el.textContent.replace(/\s+/g, ' ');
        }
      }
      return sections;
    } catch {
      return [];
    }
  })).then(all => all.flat().map(s => ({ ...s, hay: [s.title, s.heading, s.text].join('\n').toLowerCase() })));
  searchIndex.catch(() => { searchIndex = null; });
  return searchIndex;
}

function snippet(text, terms) {
  const lower = text.toLowerCase();
  let pos = -1;
  for (const t of terms) { const p = lower.indexOf(t); if (p >= 0 && (pos < 0 || p < pos)) pos = p; }
  const start = Math.max(0, pos - 50);
  let out = (start ? '…' : '') + text.slice(start, start + 160).trim() + (text.length > start + 160 ? '…' : '');
  out = escapeHtml(out);
  const re = new RegExp('(' + terms.map(t => escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return out.replace(re, '<mark>$1</mark>');
}

async function runSearch(query) {
  const results = $('#search-results');
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) { results.textContent = ''; return; }
  const index = await buildSearchIndex();
  if ($('#search-input').value !== query) return;
  const hits = [];
  for (const s of index) {
    if (!terms.every(t => s.hay.includes(t))) continue;
    let score = 0;
    for (const t of terms) {
      if (s.title.toLowerCase().includes(t)) score += 10;
      if (s.heading.toLowerCase().includes(t)) score += 5;
      score += Math.min(5, s.text.toLowerCase().split(t).length - 1);
    }
    if (!s.heading && !s.text.trim()) score -= 1;
    hits.push({ s, score });
  }
  hits.sort((a, b) => b.score - a.score);
  results.textContent = '';
  if (!hits.length) { results.append(h('li', { class: 'search-empty' }, 'No results for “' + query + '”')); return; }
  for (const { s } of hits.slice(0, 40)) {
    const text = h('span', { class: 'result-text' });
    text.innerHTML = snippet(s.text.trim(), terms);
    results.append(h('li', {}, h('a', { href: routeHref(s.page, s.anchor) },
      h('span', { class: 'result-title' }, s.title, s.heading ? h('span', { class: 'result-heading' }, ' › ' + s.heading) : ''),
      text)));
  }
  selectResult(0);
}

function selectResult(i) {
  const items = $$('#search-results a');
  items.forEach((a, j) => a.classList.toggle('selected', i === j));
  items[i]?.scrollIntoView({ block: 'nearest' });
}

function openSearch() {
  const dlg = $('#search');
  if (dlg.open) return;
  dlg.showModal();
  $('#search-input').select();
  buildSearchIndex();
}

// ---------- setup ----------

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('wiki-theme', theme);
}

function setup() {
  $('#theme-toggle').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  $('#menu-toggle').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#backdrop').addEventListener('click', () => document.body.classList.remove('nav-open'));
  $('#search-open').addEventListener('click', openSearch);

  const dlg = $('#search');
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  $('#search-results').addEventListener('click', e => { if (e.target.closest('a')) dlg.close(); });
  const input = $('#search-input');
  input.addEventListener('input', () => runSearch(input.value));
  input.addEventListener('keydown', e => {
    const items = $$('#search-results a');
    const i = items.findIndex(a => a.classList.contains('selected'));
    if (e.key === 'ArrowDown') { e.preventDefault(); selectResult(Math.min(items.length - 1, i + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); selectResult(Math.max(0, i - 1)); }
    else if (e.key === 'Enter' && items[i]) { e.preventDefault(); location.hash = items[i].getAttribute('href'); dlg.close(); }
  });

  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); }
  });

  const lightbox = $('#lightbox');
  lightbox.addEventListener('click', () => lightbox.close());
  $('#content').addEventListener('click', e => {
    const img = e.target.closest('img.zoomable');
    if (!img) return;
    $('img', lightbox).src = img.currentSrc || img.src;
    $('img', lightbox).alt = img.alt;
    lightbox.showModal();
  });

  $('#search-kbd').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl K';
  window.addEventListener('hashchange', () => show(currentRoute()));
}

async function init() {
  setup();
  try {
    const nav = await fetch('navigation.md', { cache: 'no-cache' });
    if (nav.ok) state.nav = parseNav(await nav.text());
  } catch { /* no navigation, pages still work */ }
  state.flat = state.nav.flatMap(e => e.items || [e]).filter(e => e.page);
  renderNav();
  show(currentRoute());
}

init();
})();
</script>
</body>
</html>
